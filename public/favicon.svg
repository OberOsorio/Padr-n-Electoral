<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle with gradient -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#shieldGrad)" filter="url(#glow)" />
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />

  <!-- Shield Icon (Lucide Shield) centered -->
  <path 
    d="M32 46C32 46 44 40 44 31V19L32 14.5L20 19V31C20 40 32 46 32 46Z" 
    stroke="#FFFFFF" 
    stroke-width="3.5" 
